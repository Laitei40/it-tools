    description: 'စာသားနှစ်ခုကို နှိုင်းယှဉ်ပြီး ၎င်းတို့အကြား ကွာခြားချက်များကို ကြည့်ရှုပါ။'

  otp-generator:
    title: 'OTP code ထုတ်ပေးစနစ်'
    description: 'Multi-factor authentication အတွက် time-based OTP (one time password) ကို ထုတ်ပေးပြီး စစ်ဆေးပါ။'

  url-encoder:
    title: 'URL ဖော်မတ် စာကြောင်းများကို Encode/decode ပြုလုပ်ခြင်း'
    description: 'စာသားကို URL-encoded format ("percent-encoded" ဟုလည်းခေါ်သည်) အဖြစ် encode လုပ်ပါ၊ သို့မဟုတ် ၎င်းမှ decode ပြန်လုပ်ပါ။'

  text-to-binary:
    title: 'စာသားမှ ASCII binary သို့'
    description: 'စာသားကို ASCII binary ကိုယ်စားပြုမှုအဖြစ် ပြောင်းလဲပါ၊ ပြန်လှန်၍လည်း ပြုလုပ်နိုင်သည်။'
