about:
  content: >
    # IT-Tools အကြောင်း

    ဤအံ့ဖွယ်ကောင်းသော ဝဘ်ဆိုက်ကို [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about) မှ ❤ ဖြင့် ပြုလုပ်ထားပြီး၊ developer များနှင့် IT ကဏ္ဍတွင် လုပ်ကိုင်သူများအတွက် အသုံးဝင်သော ကိရိယာများကို စုစည်းထားသည်။ အသုံးဝင်သည်ဟု ယူဆပါက၊ အသုံးဝင်နိုင်သူများနှင့် မျှဝေပေးပါ၊ သင့် shortcut bar တွင် bookmark လုပ်ထားရန် မမေ့ပါနှင့်!

    IT Tools သည် open-source (GPL-3.0 license အောက်တွင်) ဖြစ်ပြီး အခမဲ့ဖြစ်ပြီး၊ ဆက်လက်၍လည်း အခမဲ့ပင် ဖြစ်နေမည်ဖြစ်သော်လည်း၊ host လုပ်ရန်နှင့် domain name ကို renew လုပ်ရန် ကုန်ကျစရိတ်ရှိသည်။ ကျွန်ုပ်၏ လုပ်ငန်းကို ပံ့ပိုးလိုပြီး ကိရိယာများ ပိုမိုထည့်သွင်းရန် အားပေးလိုပါက၊ [sponsor လုပ်ခြင်း](https://www.buymeacoffee.com/cthmsst) ဖြင့် ပံ့ပိုးပေးရန် စဉ်းစားပေးပါ။

    ## နည်းပညာများ

    IT Tools ကို Vue.js (Vue 3) ဖြင့် Naive UI component library နှင့်အတူ ပြုလုပ်ထားပြီး Vercel မှ host လုပ်ပြီး ဆက်တိုက် deploy လုပ်ပေးထားသည်။ ကိရိယာအချို့တွင် third-party open-source library များကို အသုံးပြုထားပြီး၊ repository ၏ [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) ဖိုင်တွင် အပြည့်အစုံစာရင်းကို ရှာတွေ့နိုင်သည်။

    ## Bug တွေ့ပါသလား? ကိရိယာတစ်ခု ပျောက်နေပါသလား?

    လက်ရှိတွင် မရှိသေးသော ကိရိယာတစ်ခု လိုအပ်ပြီး၊ အသုံးဝင်နိုင်သည်ဟု ထင်မြင်ပါက၊ GitHub repository ၏ [issues section](https://github.com/CorentinTh/it-tools/issues/new/choose) တွင် feature request တစ်ခု တင်သွင်းနိုင်ပါသည်။

    Bug တစ်ခု တွေ့ရှိပါက၊ သို့မဟုတ် မျှော်လင့်ထားသလို အလုပ်မလုပ်ပါက၊ GitHub repository ၏ [issues section](https://github.com/CorentinTh/it-tools/issues/new/choose) တွင် bug report တစ်ခု တင်သွင်းပေးပါ။

